plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id 'eclipse'
    id 'maven-publish'
}

archivesBaseName = archives_base_name
version = mod_version
group = maven_group

if (System.getenv('BUILD_NUMBER') != null) {
    version = "${version}." + System.getenv('BUILD_NUMBER')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            server()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        data {
            data()
            programArguments.addAll '--mod', 'unearthed', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

    }

    mods {
        unearthed {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    maven { url = 'https://www.cursemaven.com' }
    maven {
        name = 'Shedaniel Maven' // Cloth Config
        url 'https://maven.shedaniel.me/'
    }
    maven {
        name = "Jared's maven" // JEI
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    // NeoForge/NeoForm artifacts used by the moddev plugin
    maven { url = 'https://maven.neoforged.net/releases' }
    flatDir { dir 'libs' }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    // Stone-replacer worldgen (formerly the separate Hyle mod) is now part of this mod;
    // it needs zero-allocation-hashing at runtime, embedded via Jar-in-Jar.
    jarJar(implementation('net.openhft:zero-allocation-hashing:0.16'))
    additionalRuntimeClasspath 'net.openhft:zero-allocation-hashing:0.16'
    // ProjectE compat disabled: PE1.1.0's Java API (moze_intel.projecte.api.*) no longer matches
    // what ProjectECompat.java was written against, and ProjectE compat isn't essential.
    // ProjectECompat.java has been stubbed to a no-op. Re-add this dependency and re-implement
    // the compat class if ProjectE support is needed later.
    // implementation "curse.maven:projecte-226410:6611984"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'unearthed',
                'Specification-Vendor'    : 'Mysticpasta1',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'Mysticpasta1',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact jar
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
